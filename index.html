<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDTEAM AI SIGNALS</title>
<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial;
  text-align:center;
}
.box{
  max-width:420px;
  margin:70px auto;
  background:#151515;
  padding:28px;
  border-radius:25px;
  box-shadow:0 0 30px gold;
}
h1{color:gold;}
select,button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  background:gold;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
#result{
  margin-top:25px;
  font-size:18px;
  line-height:1.8;
}
.final{
  font-size:30px;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="box">
  <h1>ABDTEAM AI SIGNALS</h1>

  <select id="pair">
    <option>EUR/USD</option>
    <option>GBP/USD</option>
    <option>USD/JPY</option>
    <option>USD/CHF</option>
    <option>USD/CAD</option>
    <option>AUD/USD</option>
    <option>NZD/USD</option>
    <option>EUR/JPY</option>
    <option>GBP/JPY</option>
    <option>EUR/GBP</option>
    <option>EUR/CHF</option>
    <option>EUR/CAD</option>
    <option>EUR/AUD</option>
    <option>GBP/CHF</option>
    <option>GBP/CAD</option>
    <option>AUD/JPY</option>
    <option>AUD/CAD</option>
    <option>AUD/CHF</option>
    <option>CAD/JPY</option>
    <option>CHF/JPY</option>
    <option>NZD/JPY</option>
  </select>

  <select id="time">
    <option>1 Minute</option>
    <option>2 Minutes</option>
    <option>5 Minutes</option>
  </select>

  <button onclick="generateSignal()">START ANALYSIS</button>

  <div id="result"></div>
</div>

<script>
function generateSignal(){
  const API_KEY = "G477NVIC5MVIFCST";
  const result = document.getElementById("result");

  result.innerHTML =
    "🤖 AI SCANNING MARKET...<br>" +
    "📡 Reading candles...<br>" +
    "📊 Checking trend...<br>" +
    "⚡ Measuring momentum...";

  setTimeout(function(){
    fetch(https://www.alphavantage.co/query?function=FX_INTRADAY&from_symbol=EUR&to_symbol=USD&interval=1min&apikey=${API_KEY})
.then(response => response.json())
.then(data => {

const priceData = data["Time Series FX (1min)"];
const latest = Object.values(priceData)[0];

const open = parseFloat(latest["1. open"]);
const close = parseFloat(latest["4. close"]);

let signal = close > open ? "CALL 🟢" : "PUT 🔴";
let trend = close > open ? "Strong Bullish" : "Strong Bearish";
let confidence = Math.floor(Math.random() * 10) + 90;

result.innerHTML = `
🤖 تحليل السوق الحقيقي<br><br>

📈 الاتجاه: ${trend}<br>
🪙 سعر الافتتاح: ${open}<br>
💵 السعر الحالي: ${close}<br><br>

🎯 الإشارة النهائية:<br>
<span class="final">${signal}</span><br><br>

🔥 الثقة: ${confidence}%
`;

})
.catch(error => {
result.innerHTML = "❌ API ERROR";
});
  }, 2500);
}
</script>

</body>
</html>
