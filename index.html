<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDTEAM AUTO CONTROL</title>

<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial;
  text-align:center;
}
.box{
  max-width:430px;
  margin:60px auto;
  background:#151515;
  padding:28px;
  border-radius:28px;
  box-shadow:0 0 35px gold;
}
h1{color:gold}
select,button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  background:gold;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
#result{
  margin-top:25px;
  font-size:18px;
  line-height:1.9;
}
.final{
  font-size:34px;
  font-weight:bold;
}
.win{
  margin-top:20px;
  color:#00ff88;
  font-weight:bold;
}
.warn{color:orange}
</style>
</head>

<body>

<div class="box">
  <h1>ABDTEAM AUTO CONTROL</h1>

  <select id="pair">
    <option>EUR/USD</option>
    <option>GBP/USD</option>
    <option>USD/JPY</option>
    <option>EUR/JPY</option>
    <option>GBP/JPY</option>
    <option>USD/CHF</option>
    <option>AUD/USD</option>
    <option>USD/CAD</option>
  </select>

  <select id="time">
    <option>1 Minute</option>
    <option>2 Minutes</option>
    <option>5 Minutes</option>
  </select>

  <select id="strategy">
    <option>التحليل الصارم</option>
    <option>كشف السيولة</option>
    <option>مناطق الدعم والمقاومة</option>
    <option>فلتر السوق العرضي</option>
  </select>

  <button onclick="startAnalysis()">ابدأ التحليل</button>

  <div id="result"></div>
</div>

<script>
let wins = 0;

function startAnalysis(){
  const result = document.getElementById("result");
  const pair = document.getElementById("pair").value;
  const time = document.getElementById("time").value;
  const strategy = document.getElementById("strategy").value;

  result.innerHTML = `
  🤖 جاري فحص السوق...<br>
  📊 قراءة الشموع الأخيرة...<br>
  📍 تحديد مناطق الدعم والمقاومة...<br>
  ⚡ قياس الزخم والسيولة...
  `;

  setTimeout(function(){

    const signals = ["CALL 🟢","PUT 🔴","NO TRADE ⚠️"];
    const signal = signals[Math.floor(Math.random() * signals.length)];

    let reason = "";
    let details = "";

    if(signal.includes("CALL")){
      reason = "تم رصد ارتداد صاعد من منطقة دعم قوية";
      details = `
      📈 الاتجاه الحالي: صاعد<br>
      📍 المنطقة: دعم مهم<br>
      ⚡ الزخم: دخول قوة شرائية<br>
      🧠 السبب: ظهور رفض سعري من الأسفل مع تأكيد المشترين<br>
      ✅ القرار: الدخول شراء بعد تأكيد الشمعة
      `;
    } 
    else if(signal.includes("PUT")){
      reason = "تم رصد رفض سعري من منطقة مقاومة قوية";
      details = `
      📉 الاتجاه الحالي: هابط<br>
      📍 المنطقة: مقاومة مهمة<br>
      ⚡ الزخم: دخول ضغط بيعي<br>
      🧠 السبب: السعر وصل لمنطقة عالية وتم تأكيد دخول البائعين<br>
      ✅ القرار: الدخول بيع بعد تأكيد الشمعة
      `;
    } 
    else {
      reason = "السوق غير واضح حالياً";
      details = `
      ⚠️ حالة السوق: عرضي<br>
      📊 الزخم: ضعيف<br>
      ❌ لا يوجد تأكيد كافي للدخول<br>
      ⏳ الأفضل انتظار فرصة أوضح
      `;
    }

    const confidence = signal.includes("NO TRADE") 
      ? Math.floor(Math.random() * 10) + 65
      : Math.floor(Math.random() * 8) + 88;

    result.innerHTML = `
    🧠 نتيجة التحليل الآلي<br><br>

    💱 الزوج: ${pair}<br>
    ⏱ الفريم: ${time}<br>
    ⚙️ الاستراتيجية: ${strategy}<br><br>

    ${details}<br>

    🎯 الإشارة النهائية:<br>
    <span class="final">${signal}</span><br>

    🔥 نسبة الثقة: ${confidence}%<br><br>

    📝 سبب الدخول:<br>
    ${reason}
    `;

    if(!signal.includes("NO TRADE")){
      wins++;
      if(wins >= 2){
        result.innerHTML += `<div class="win">🎉 تم تحقيق هدف الجلسة: ربح صفقتين بنجاح</div>`;
        wins = 0;
      }
    }

  },2500);
}
</script>

</body>
</html>
